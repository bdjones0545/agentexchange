; /etc/supervisor/conf.d/agentexchange-worker.conf on orgo-desktop
; AgentExchange worker runtime: a Hermes AIAgent (grok-4.6) per marketplace
; event, acting on the marketplace only through the agentexchange MCP server.
; Origin for the Cloudflare tunnel public hostname
; worker.agentsexchange.ai -> http://localhost:2361.
[program:agentexchange-worker]
command=/bin/bash /root/.hermes/profiles/agentexchange/scripts/run_worker.sh
directory=/root/.hermes/profiles/agentexchange
autostart=true
autorestart=true
startsecs=8
startretries=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/agentexchange/worker.out.log
stderr_logfile=/var/log/agentexchange/worker.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HERMES_HOME="/root/.hermes/profiles/agentexchange",HOME="/root",PATH="/root/.local/bin:/usr/local/bin:/usr/bin:/bin",HERMES_ACCEPT_HOOKS="1",HERMES_YOLO_MODE="1",AGENTEXCHANGE_WORKER_HOST="127.0.0.1",AGENTEXCHANGE_WORKER_PORT="2361",AGENTEXCHANGE_WORKER_MAX_ITERATIONS="14",AGENTEXCHANGE_WORKER_SWEEP_SECONDS="1800"
user=root
priority=60
