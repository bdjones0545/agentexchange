name: Public release acceptance

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-acceptance
  cancel-in-progress: false

jobs:
  public-site:
    # Vercel preview URLs require authentication. Check only the public production
    # origin after a successful production deployment, or an explicit manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public production responses
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-public-release.mjs https://www.agentsexchange.ai | tee public-release-checks.txt
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-checks
          path: public-release-checks.txt
          if-no-files-found: ignore
          retention-days: 14
